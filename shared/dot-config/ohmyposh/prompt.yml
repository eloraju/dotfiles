# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version: 3
final_space: true
console_title_template: "{{ .Shell }} in {{ .Folder }}"

palette:
  black: "#262B44"
  blue: "#4B95E9"
  green: "#59C9A5"
  orange: "#F07623"
  red: "#D81E5B"
  white: "#E0DEF4"
  yellow: "#F3AE35"
  py: "#FFE873"
  purple: "#B381C5"

blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: session
        style: "plain"
        foreground: p:white
        background: transparent
        template: "{{ if .SSHSession }}[ {{ .UserName }}@{{ .HostName }}]{{ end }} "

      - type: path
        style: plain
        foreground: cyan
        background: transparent
        template: "{{ path .Path .Location }} "
        options:
          style: full

      - type: python
        style: plain
        foreground: p:py
        background: transparent
        template: "{{- if .Venv }}( {{ .Venv }}) {{ end }}"
        options:
          fetch_virtual_env: true
          display_default: true
          folder_name_fallback: true
          display_mode: always

      - type: git
        style: plain
        foreground: p:purple
        background: transparent
        template: >-
          󰊢 {{ if gt .Behind 0 }}<red>↓</>{{ end }}
          {{- if gt .Ahead 0 }}<red>↑</>{{end}}
          {{- .HEAD }}
          {{- if gt .StashCount 0}}<red>$</>{{end}}
          {{ if .Working.Changed }}<red>[{{ .Working.String }}]</>{{ end }}
          {{- if .Staging.Changed }}<yellow>[{{ .Staging.String }}]</>{{ end }}
        options:
          commit_icon: "@"
          branch_icon: ""
          #branch_max_length: 25
          fetch_status: true
          fetch_upstream_icon: true
          status_formats:
            Added: +%d
            Untracked: ?%d
            Modified: ~%d
            Deleted: -%d
            Unmerged: x%d

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground_templates:
          - "{{ if gt .Code 0 }}p:red{{ end }}"
          - "{{ if eq .Code 0 }}p:green{{ end }}"
        background: transparent
        template: ❯

transient_prompt:
  foreground: p:cyan
  background: transparent
  template: "❯ "

secondary_prompt:
  foreground: p:green
  background: transparent
  template: ❯❯
